map $http_upgrade $ultimate_connection {
	default upgrade;
	'' close;
}

server {
	listen 8000 default_server;
	listen [::]:8000 default_server;
	server_name _;
	client_max_body_size 50m;

	location / {
		# exe.dev's HTTPS proxy injects these. Refuse anything else so the
		# agent UI is not reachable as a public website.
		if ($http_x_exedev_email != "nguyentrongtin2331@gmail.com") { return 403; }
		if ($http_x_exedev_userid = "") { return 403; }

		proxy_pass http://127.0.0.1:4747;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header Forwarded "";
		proxy_set_header X-ExeDev-Email $http_x_exedev_email;
		proxy_set_header X-ExeDev-UserID $http_x_exedev_userid;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $ultimate_connection;
		proxy_buffering off;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
}
